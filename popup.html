<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shield - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 380px;
            min-height: 500px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
        }

        .container {
            padding: 0;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            padding: 1.5rem;
            border-bottom: 2px solid #3b82f6;
            text-align: center;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }

        .header h1 {
            font-size: 1.375rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.25rem;
        }

        .header p {
            font-size: 0.875rem;
            color: #06b6d4;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* CONTENT */
        .content {
            padding: 2rem 1.5rem;
        }

        /* LOGIN SECTION */
        .login-section {
            display: none;
        }

        .login-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 0.9375rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9375rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 0.75rem;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            font-size: 0.8125rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }

        /* LOGGED IN SECTION */
        .logged-in-section {
            display: none;
        }

        .logged-in-section.active {
            display: block;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #06b6d4;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 900;
            color: white;
            line-height: 1;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .stat-description {
            font-size: 0.8125rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 0.5rem;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .user-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .user-info-row:last-child {
            margin-bottom: 0;
        }

        .user-info-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            text-transform: uppercase;
        }

        .user-info-value {
            font-size: 0.875rem;
            color: white;
            font-weight: 700;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            margin-top: 1.5rem;
            font-size: 0.8125rem;
            color: #10b981;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 0.875rem;
            border-radius: 10px;
            font-size: 0.8125rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .link {
            color: #06b6d4;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .link:hover {
            text-decoration: underline;
        }

        .text-center {
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🛡️</div>
            <h1>AI Shield</h1>
            <p>Compliance Auditor</p>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Error Message -->
            <div class="error-message" id="errorMessage"></div>

            <!-- LOGIN SECTION -->
            <div class="login-section active" id="loginSection">
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        Sign In
                    </button>
                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button class="btn btn-secondary" onclick="openDashboard()">
                    Open Dashboard
                </button>

                <div class="text-center">
                    <a href="https://www.getaishield.eu/signup" class="link" target="_blank">
                        Don't have an account? Sign up
                    </a>
                </div>
            </div>

            <!-- LOGGED IN SECTION -->
            <div class="logged-in-section" id="loggedInSection">
                <div class="stat-card">
                    <div class="stat-label">Detections Today</div>
                    <div class="stat-value" id="detectionCount">0</div>
                    <div class="stat-description">Data leaks prevented</div>
                </div>

                <div class="user-info">
                    <div class="user-info-row">
                        <span class="user-info-label">Company</span>
                        <span class="user-info-value" id="companyName">-</span>
                    </div>
                    <div class="user-info-row">
                        <span class="user-info-label">User</span>
                        <span class="user-info-value" id="userEmail">-</span>
                    </div>
                    <div class="user-info-row">
                        <span class="user-info-label">Plan</span>
                        <span class="user-info-value">Team</span>
                    </div>
                </div>

                <button class="btn btn-secondary" onclick="openDashboard()">
                    Open Dashboard
                </button>

                <button class="btn btn-secondary" onclick="logout()">
                    Logout
                </button>

                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>Real-time monitoring active</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://ai-shield-backend-production.up.railway.app';
        const DASHBOARD_URL = 'https://www.getaishield.eu';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthStatus();
            loadDetectionCount();
        });

        // Check if user is logged in
        async function checkAuthStatus() {
            const authToken = localStorage.getItem('authToken');
            const user = localStorage.getItem('user');
            const company = localStorage.getItem('company');

            if (authToken && user && company) {
                showLoggedIn(JSON.parse(user), JSON.parse(company));
            } else {
                showLogin();
            }
        }

        // Show login screen
        function showLogin() {
            document.getElementById('loginSection').classList.add('active');
            document.getElementById('loggedInSection').classList.remove('active');
        }

        // Show logged in screen
        function showLoggedIn(user, company) {
            document.getElementById('loginSection').classList.remove('active');
            document.getElementById('loggedInSection').classList.add('active');
            
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('companyName').textContent = company.name;
        }

        // Login form submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            hideError();

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // Save to localStorage
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('company', JSON.stringify(data.company));

                    // Save to chrome.storage for content script
                    chrome.storage.local.set({
                        authToken: data.token,
                        user: data.user,
                        company: data.company,
                        companyId: data.company.id,
                        userId: data.user.id
                    });

                    showLoggedIn(data.user, data.company);
                } else {
                    showError(data.error || 'Login failed. Please check your credentials.');
                }
            } catch (error) {
                showError('Connection error. Please try again.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // Load detection count
        function loadDetectionCount() {
            chrome.storage.local.get(['detectionCount'], (result) => {
                const count = result.detectionCount || 0;
                document.getElementById('detectionCount').textContent = count;
            });
        }

        // Update detection count from content script
        chrome.runtime.onMessage.addListener((request) => {
            if (request.action === 'updateDetectionCount') {
                loadDetectionCount();
            }
        });

        // Auto-refresh count
        setInterval(loadDetectionCount, 2000);

        // Open dashboard
        function openDashboard() {
            chrome.tabs.create({ url: `${DASHBOARD_URL}/company-dashboard` });
        }

        // Logout
        function logout() {
            localStorage.clear();
            chrome.storage.local.clear();
            showLogin();
            document.getElementById('detectionCount').textContent = '0';
        }

        // Show error
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        // Hide error
        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }
    </script>
</body>
</html>
