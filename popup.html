<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shield - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 380px;
            min-height: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
        }

        .header {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            padding: 1.5rem;
            border-bottom: 2px solid #3b82f6;
            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 24px rgba(59, 130, 246, 0.4));
        }

        .header h1 {
            font-size: 1.375rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
        }

        .header p {
            font-size: 0.875rem;
            color: #06b6d4;
            font-weight: 600;
            text-transform: uppercase;
        }

        .content { padding: 2rem 1.5rem; }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 0.9375rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9375rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 0.75rem;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #06b6d4;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 900;
            color: white;
            line-height: 1;
        }

        .stat-description {
            font-size: 0.8125rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 0.5rem;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .user-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .user-info-row:last-child {
            margin-bottom: 0;
        }

        .user-info-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            text-transform: uppercase;
        }

        .user-info-value {
            font-size: 0.875rem;
            color: white;
            font-weight: 700;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            margin-top: 1.5rem;
            font-size: 0.8125rem;
            color: #10b981;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 0.875rem;
            border-radius: 10px;
            font-size: 0.8125rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            font-size: 0.8125rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }

        .text-center {
            text-align: center;
            margin-top: 1rem;
        }

        .link {
            color: #06b6d4;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="icon.png" alt="AI Shield Logo">
            </div>
            <h1>AI Shield</h1>
            <p>Data Protection</p>
        </div>

        <div class="content">
            <div class="error-message" id="errorMessage"></div>

            <!-- LOGIN -->
            <div class="section active" id="loginSection">
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
                </form>

                <div class="divider"><span>OR</span></div>

                <button class="btn btn-secondary" id="openDashboardBtn">Open Dashboard</button>

                <div class="text-center">
                    <a href="#" class="link" id="signupLink">Don't have an account? Sign up</a>
                </div>
            </div>

            <!-- LOGGED IN -->
            <div class="section" id="loggedInSection">
                <div class="stat-card">
                    <div class="stat-label">Detections Today</div>
                    <div class="stat-value" id="detectionCount">0</div>
                    <div class="stat-description">Data leaks prevented</div>
                </div>

                <div class="user-info">
                    <div class="user-info-row">
                        <span class="user-info-label">Company</span>
                        <span class="user-info-value" id="companyName">-</span>
                    </div>
                    <div class="user-info-row">
                        <span class="user-info-label">User</span>
                        <span class="user-info-value" id="userEmail">-</span>
                    </div>
                    <div class="user-info-row">
                        <span class="user-info-label">Plan</span>
                        <span class="user-info-value" id="planName">Team</span>
                    </div>
                </div>

                <button class="btn btn-secondary" id="viewDashboardBtn">Open Dashboard</button>
                <button class="btn btn-secondary" id="logoutBtn">Logout</button>

                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>Real-time monitoring active</span>
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
